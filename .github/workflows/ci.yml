name: Seal checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make setup lint test
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --deny warnings
      - run: .venv/bin/pip-audit
      - run: docker build -t seal:test .
      - run: python3 scripts/container_smoke.py
