[package]
name = "seal-log"
version = "0.1.0"
edition = "2024"
[lib]
name = "seal_log"
path = "src/lib.rs"
[[bin]]
name = "seal"
path = "src/main.rs"
[dependencies]
sha2 = "=0.10.9"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
rand = "=0.8.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
hex = "=0.4.3"
fs2 = "=0.4.3"
tiny_http = "=0.12.0"
